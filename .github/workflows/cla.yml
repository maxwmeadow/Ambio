name: CLA

# Asks each first-time contributor to accept CLA.md on their pull request,
# and records signatures on the cla-signatures branch so main stays clean.
# pull_request_target is safe here: the job never checks out PR code.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/maxwmeadow/Ambio/blob/main/CLA.md
          branch: cla-signatures
          allowlist: maxwmeadow,dependabot[bot],github-actions[bot]
