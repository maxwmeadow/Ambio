name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Produces the installable artifact for each platform. macOS is split across
# two runners on purpose (their update manifests are merged afterwards): macos-latest is arm64, macos-13 is the last x64
# image, and an Intel build cannot be produced from an Apple Silicon host once
# native modules are involved.
# A pushed v* tag publishes every platform's installer to one draft GitHub
# Release, together with the latest*.yml files electron-updater reads. Review
# and publish the draft by hand; installed copies see the update once it is
# published. A manual run builds without publishing.
permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  label: linux-x64 }
          - { os: macos-latest,   label: macos-arm64 }
          - { os: macos-13,       label: macos-x64 }
          - { os: windows-latest, label: windows-x64 }

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-go@v6
        with:
          # go.mod's `go 1.22` is the minimum language version, not the
          # toolchain. Resolving it gave CI go1.22.12, whose internal linker
          # omits LC_UUID and current macOS refuses to load its test binaries.
          # Build with the toolchain development uses.
          go-version: '1.27.x'
          cache-dependency-path: archd-go/go.sum

      - name: Put mingw64 on PATH
        if: runner.os == 'Windows'
        run: echo "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH

      - run: npm ci

      # The updater compares versions from package.json, so a tag that does
      # not match it would publish an update nobody is offered.
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # Runs prepackage -> build:archd, so the daemon copied in via
      # extraResources is always freshly built for this host.
      - name: Package
        run: npm run package -- --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v5
        with:
          name: axiom-${{ matrix.label }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  # The arm64 and x64 jobs each publish a latest-mac.yml and the last upload
  # wins, which would leave one architecture without updates. Replace it with
  # one manifest listing both (scripts/merge-mac-manifest.mjs).
  merge-mac-manifest:
    name: macOS update manifest
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@v6
        with:
          name: axiom-macos-arm64
          path: mac-arm64

      - uses: actions/download-artifact@v6
        with:
          name: axiom-macos-x64
          path: mac-x64

      - name: Merge and replace latest-mac.yml
        run: |
          node scripts/merge-mac-manifest.mjs mac-arm64/latest-mac.yml mac-x64/latest-mac.yml > latest-mac.yml
          cat latest-mac.yml
          gh release upload "$GITHUB_REF_NAME" latest-mac.yml --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
